name: Bug
description: Reportar un error en el script o en la recomendación
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        No compartas tokens, credenciales ni salidas privadas completas.
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado / Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual / Actual behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version de OpenCode y PowerShell / OpenCode and PowerShell version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Comando y salida sanitizada / Sanitized command and output
      description: Elimina tokens, nombres de usuario y rutas personales.
    validations:
      required: true
